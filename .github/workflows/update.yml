name: Kinoprogramm aktualisieren

on:
  # Angestoßen wird das Update stündlich zur vollen Stunde von cron-job.org über die GitHub-API
  # (workflow_dispatch, Einrichtung siehe README). GitHubs eigener Zeitplan ist unzuverlässig – geplante
  # Läufe kommen oft stark verspätet oder gar nicht – und dient nur als Reserve alle 3 Stunden.
  schedule:
    - cron: '23 */3 * * *'
  # Manuell starten: Actions → "Kinoprogramm aktualisieren" → "Run workflow"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-program
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Aktuellen Stand des Branches holen (nicht den vom Zeitpunkt des Auslösens), falls ein Lauf auf
      # den vorherigen warten musste.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: scraper
        run: npm ci

      # IMDb-Bewertungen: ordnet neue Filme zu (lädt dann die großen IMDb-Dateien) und frischt die
      # Bewertungen einmal am Tag auf. Darf das Update nicht aufhalten – notfalls bleibt der alte Stand.
      - name: IMDb-Bewertungen
        continue-on-error: true
        timeout-minutes: 8
        working-directory: scraper
        run: node --max-old-space-size=4096 src/imdb.js

      # Beide Städte laufen unabhängig: Scheitert eine, wird die andere trotzdem aktualisiert.
      - name: Programm Leipzig
        id: leipzig
        continue-on-error: true
        working-directory: scraper
        run: node src/index.js --city leipzig

      - name: Programm Hamburg
        id: hamburg
        continue-on-error: true
        working-directory: scraper
        run: node src/index.js --city hamburg

      # Die Hamburger Seite entsteht aus der Leipziger (public/) – hält beide auf demselben Stand
      - name: Hamburger Seite erzeugen
        working-directory: scraper
        run: node src/sites.js

      - name: Änderungen committen
        run: |
          git add public/data/program.json hamburg/public
          if [ -f scraper/data/imdb.json ]; then git add scraper/data/imdb.json; fi
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Kinoprogramm aktualisiert ($(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M'))"
          git pull --rebase
          git push

      # Läuft erst nach dem Commit: Die Seiten werden trotzdem aktualisiert (ausgefallene Kinos behalten
      # ihre letzten Daten), aber der Lauf wird rot markiert und GitHub schickt eine Mail – erst wenn
      # ein Problem rund zwei Stunden besteht und danach einmal täglich gegen 18 Uhr.
      - name: Probleme melden
        if: >-
          steps.leipzig.outcome == 'failure' || steps.hamburg.outcome == 'failure' ||
          steps.leipzig.outputs.alert == 'true' || steps.hamburg.outputs.alert == 'true'
        run: |
          echo "::error::Leipzig: ${{ steps.leipzig.outcome }}, ${{ steps.leipzig.outputs.problems || '?' }} Kino(s) mit Problemen – Hamburg: ${{ steps.hamburg.outcome }}, ${{ steps.hamburg.outputs.problems || '?' }} Kino(s) mit Problemen. Details in der Zusammenfassung dieses Laufs."
          exit 1
