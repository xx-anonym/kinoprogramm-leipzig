name: Kinoprogramm aktualisieren

on:
  # Angestoßen wird das Update stündlich zur vollen Stunde von cron-job.org über die GitHub-API
  # (workflow_dispatch, Einrichtung siehe README). GitHubs eigener Zeitplan ist unzuverlässig – geplante
  # Läufe kommen oft stark verspätet oder gar nicht – und dient nur als Reserve alle 3 Stunden.
  schedule:
    - cron: '23 */3 * * *'
  # Manuell starten: Actions → "Kinoprogramm aktualisieren" → "Run workflow"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-program
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Aktuellen Stand des Branches holen (nicht den vom Zeitpunkt des Auslösens), falls ein Lauf auf
      # den vorherigen warten musste.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: scraper
        run: npm ci

      - name: Programm abrufen
        id: scrape
        working-directory: scraper
        run: node src/index.js

      - name: Änderungen committen
        run: |
          if git diff --quiet -- public/data/program.json; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/program.json
          git commit -m "Kinoprogramm aktualisiert ($(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M'))"
          git pull --rebase
          git push

      # Läuft erst nach dem Commit: Die Seite wird trotzdem aktualisiert (ausgefallene Kinos behalten
      # ihre letzten Daten), aber der Lauf wird rot markiert und GitHub schickt eine Mail – nur wenn
      # ein Problem auch beim nächsten Lauf noch besteht und danach einmal täglich gegen 18 Uhr.
      - name: Probleme melden
        if: steps.scrape.outputs.alert == 'true'
        run: |
          echo "::error::Bei ${{ steps.scrape.outputs.problems }} Kino(s) gab es Probleme – Details in der Zusammenfassung dieses Laufs."
          exit 1
